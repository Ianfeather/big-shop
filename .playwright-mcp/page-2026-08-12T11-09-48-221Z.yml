            - heading "It won’t do the cooking. It’ll stop the deciding." [level=3] [ref=e82]
            - paragraph [ref=e83]: Deciding is the part that actually takes the time. Everything you’ve liked before is in one place, tagged and searchable, so choosing five meals for the week is five ticks — not half an hour of “I don’t mind, what do you fancy?” on a Sunday night.
          - article [ref=e84]:
            - heading "It doesn’t make food cheaper. It stops you buying it twice." [level=3] [ref=e85]
            - paragraph [ref=e86]: Three jars of cumin. A second bag of rice. The mid-week top-up trip that somehow costs forty quid. Buying for the whole week in one go, off a list that has already added everything up, is the cheap way to shop — this is the thing that makes actually doing it possible.
