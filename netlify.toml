[build]
  command = "./build.sh"
  publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

# There is deliberately no [build.environment] GO_VERSION here.
#
# It was kept through the Fly cutover's cooling-off period because Netlify went
# on *compiling* the Lambda in netlify-functions/recipes on every deploy as the
# rollback target, and an unpinned build would have taken whatever Go version
# Netlify's image defaulted to - a failure that takes the whole site down, not
# just the API. There is no longer a Lambda to compile: its entry point and the
# aws-lambda-go dependencies are gone, and the directory is now api/.
#
# So this build needs no Go toolchain at all. If a Netlify build ever starts
# trying to compile Go again, the functions directory setting in the Netlify UI
# is the thing to look at - it is configured there, not here, which is exactly
# why its absence from this file never meant it was not happening.

# Proxies the Go API, which now runs on Fly.io in Frankfurt
# (docs/adr/0006-go-api-leaves-netlify-functions.md), so it stays on
# www.bigshop.life and remains same-origin to the browser - no CORS, and the
# Auth0 bearer token keeps working exactly as it did.
#
# status = 200 makes this a rewrite rather than a redirect: Netlify fetches the
# origin and returns its response under the original URL. Measured on a throwaway
# branch deploy against an echoing origin (spec Phase 0, PR #74, since closed),
# because Netlify's docs do not say: Authorization survives intact, arbitrary
# headers pass verbatim, PUT/PATCH/DELETE are all proxied, and method, body and
# Content-Type are preserved on POST. That is why there is no api.bigshop.life
# subdomain here.
#
# force = true so this wins over anything Netlify would otherwise serve at the
# path, including whatever @netlify/plugin-nextjs claims. Phase 0 only measured
# the rewrite with force on, so treat "it would work without it" as untested
# rather than false.
#
# Note the pattern matches /api/bigshop/<something>, not a bare /api/bigshop.
# Nothing requests the base path on its own - every call in lib/api-client.ts
# appends a route - but a future one would need a second rule.
#
# Two things Netlify does on the way through, worth knowing:
#  - It rewrites Accept to "*/*,image/webp". Huma content-negotiates on Accept;
#    */* resolves to JSON, verified against the container directly.
#  - The proxy has a 26 second ceiling. Comfortable for CRUD, worth remembering
#    if an endpoint ever grows slow.
#
# /api/bigshop rather than /api: the latter would swallow the Next.js API routes
# under pages/api, which stay on Netlify.
[[redirects]]
  from = "/api/bigshop/*"
  to = "https://big-shop-api.fly.dev/api/bigshop/:splat"
  status = 200
  force = true
