          - heading "Built for one household’s weekly shop" [level=2] [ref=e142]
          - paragraph [ref=e143]: There’s no growth team here, and no roadmap of things nobody asked for. It does recipes, and the list that falls out of them, and it does those properly. It isn’t going to become your calendar, your macros tracker or your fridge.
        - article [ref=e144]:
