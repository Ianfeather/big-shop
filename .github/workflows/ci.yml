name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: @netlify/plugin-nextjs (devDependency, needed only
      # so netlify.toml's plugin resolves locally for Netlify's own deploy
      # build) pulls in the ancient, unmaintained @netlify/esbuild@0.14.39.
      # Its postinstall can't locate/fetch its own Linux binary and fails
      # `npm ci` outright on every platform tested (verified in a plain
      # node:22-bookworm container, both linux-64 and linux-arm64 - not a
      # registry flake). Nothing our build/lint/test steps need (esbuild via
      # Vite/Vitest, @next/swc-*) requires a postinstall step to work - both
      # ship their platform binary directly via optionalDependencies.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
