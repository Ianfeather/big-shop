services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - bigshop-db-data:/var/lib/mysql
      - ./migrations:/migrations:ro
      - ./docker/mysql-seed:/seed:ro
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Two things have to be true, and this asserts both in one query.
      #
      # 1. The real server is up. -h 127.0.0.1 (not "localhost") is deliberate:
      #    the MySQL client treats the literal host "localhost" as "connect via
      #    the Unix socket", and the official image's entrypoint runs
      #    docker-entrypoint-initdb.d (our migrate-and-seed script) against a
      #    temporary, --skip-networking mysqld that still binds that same
      #    socket file before the real, fully-networked server starts. A
      #    "-h localhost" ping can therefore report Healthy against that
      #    temporary instance while migrations/seeding are still running, which
      #    then lets `api` (depends_on: service_healthy) start against a
      #    half-initialized DB. Forcing TCP via "127.0.0.1" only succeeds once
      #    the real server (post-init) is listening.
      #
      # 2. The migrations actually applied. 01-migrate-and-seed.sh runs
      #    `mysql --force`, which skips a failing statement and still exits 0,
      #    so a broken migration used to leave a silently incomplete schema
      #    behind a Healthy container - see
      #    docker/mysql-init/expected-migration-errors.txt. The script now
      #    writes its verdict to bigshop._migration_status, and this is what
      #    reads it. Being a row in the data directory rather than an exit
      #    code is the point: `restart: unless-stopped` would resurrect a
      #    container that exited, and the entrypoint skips the init scripts on
      #    that second start because the data directory is no longer empty.
      #
      # Unhealthy here means: `docker compose logs db`, then
      # `docker compose down -v && docker compose up -d db` once fixed.
      # 3. A data directory created before _migration_status existed is not a
      #    failure. The script creates that table before it applies anything,
      #    so on any volume it has ever run, the table is there - absence means
      #    the volume predates this check entirely. The entrypoint will never
      #    re-run migrations on it (non-empty data directory), so there is
      #    nothing for the check to check, and it falls back to the plain ping
      #    this healthcheck used to be. Without that, upgrading turned every
      #    existing developer's database unhealthy and the only way out was
      #    `down -v`, which throws away a synced copy of production.
      test:
        - CMD-SHELL
        - >-
          if mysql -h 127.0.0.1 -uroot -proot -N -B -e "SELECT ok FROM bigshop._migration_status WHERE id = 1" 2>/dev/null | grep -qx 1; then exit 0; fi;
          if mysql -h 127.0.0.1 -uroot -proot -N -B -e "SELECT 1 FROM bigshop._migration_status LIMIT 0" >/dev/null 2>&1; then exit 1; fi;
          mysqladmin ping -h 127.0.0.1 -uroot -proot
      interval: 5s
      timeout: 5s
      retries: 20

  # Collector, Tempo, Loki, Prometheus and Grafana in one image - the local
  # stand-in for the Grafana Cloud stack, so no cloud credentials exist outside
  # production and development noise never touches the free-tier quota
  # (docs/adr/0007-observability-otel-grafana-cloud.md).
  #
  # Grafana is on ${GRAFANA_PORT:-3200}, NOT 3000. specs/completed/observability.md says
  # 3000 is free because "dev-full.sh serves the web app on 3001" - it doesn't:
  # scripts/dev-full.sh defaults WEB_PORT to 3000 and only moves off it on a
  # collision. Publishing Grafana there would silently push the web app to 3001
  # on every `npm run dev:full`, so Grafana gets its own port instead.
  #
  # No healthcheck and nothing depends_on it: a dead collector must never be
  # able to hold up the API (ADR-0007's "telemetry must never affect the
  # application"), and that has to be true of the local stack too or the failure
  # mode is only ever exercised in production.
  lgtm:
    image: grafana/otel-lgtm:0.30.1
    restart: unless-stopped
    environment:
      # Without this, the two Netlify-side metrics cannot be seen locally at
      # all - and they fail *silently*, which is worse than failing.
      #
      # ADR-0008 §2 requires delta temporality from the Next.js functions,
      # because a Lambda dies constantly and cumulative counters would reset
      # endlessly. Grafana Cloud accepts delta; this image's Prometheus, which
      # is what stands in for it locally, does not - its OTLP receiver drops
      # delta points on the floor and logs nothing, so `bigshop_import_outcome`
      # and `bigshop_llm_tokens` simply never appear while the Go API's
      # cumulative metrics arrive perfectly. It is a convincing impression of an
      # instrumentation bug.
      #
      # The flag is behind PROMETHEUS_EXTRA_ARGS rather than baked in because
      # that is the hook the image provides (see /otel-lgtm/run-prometheus.sh).
      PROMETHEUS_EXTRA_ARGS: "--enable-feature=otlp-deltatocumulative"
    ports:
      - "${GRAFANA_PORT:-3200}:3000"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - bigshop-lgtm-data:/data

  api:
    build:
      context: ./netlify-functions/recipes
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The connection, by component. There is no DSN string here any more:
      # parseTime, interpolateParams and collation are literals in
      # netlify-functions/recipes/dsn.go, because not one of them ever differed
      # between this stack and production - and a hand-written string is exactly
      # how production came to lose parseTime and answer 500 on GET /user for a
      # day. See that file for the reasoning, and never add multiStatements.
      #
      # TIDB_* rather than DB_*, matching .env.tidb, even though this particular
      # database is a MySQL container rather than TiDB. One name for one thing
      # beats two conventions.
      #
      # TIDB_TLS is deliberately absent: this speaks to a container over the
      # compose network. Production sets it in fly.toml.
      TIDB_HOST: "db"
      TIDB_PORT: "3306"
      TIDB_USER: "root"
      TIDB_PASSWORD: "root"
      TIDB_DB: "bigshop"
      DISABLE_AUTH: "true"
      DEV_USER_ID: "local-dev-user"
      # Read by the OTel SDK's own env handling (telemetry.Setup passes no
      # explicit endpoint). Empty means telemetry is off, which is what
      # `go test`, the Lambda path and the e2e stack get.
      #
      # The `-` (not `:-`) is deliberate: it substitutes the default only when
      # the variable is *unset*, so e2e can pass an explicit empty string to
      # turn telemetry off, rather than having the default reinstated.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT-http://lgtm:4318}"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./netlify-functions/recipes:/app

volumes:
  bigshop-db-data:
  bigshop-lgtm-data:
