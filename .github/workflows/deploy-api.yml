# Deploys the Go API to Fly.io (app `big-shop-api`, region fra).
#
# Netlify no longer deploys this API - see
# docs/adr/0006-go-api-leaves-netlify-functions.md. The Next.js site is still
# Netlify's, deployed on its own from the same push; the two pipelines are
# independent, which is one of the migration's accepted consequences.
name: Deploy API

# Gated on CI rather than triggered directly by the push, so a master commit
# that fails `go test` or a drift check is never deployed. `workflow_run` fires
# after CI finishes; the `if` below is what makes success (not merely
# completion) the condition - without it this would deploy failed builds, since
# `completed` includes `failure` and `cancelled`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # For redeploying master without pushing anything - e.g. after rotating a Fly
  # secret, which does not itself trigger a release. Always master, whatever
  # branch it is dispatched from: see the checkout step.
  workflow_dispatch:

# One deploy at a time. Queued rather than superseded (cancel-in-progress:
# false) because the thing being cancelled is a `flyctl deploy` mid-release -
# killing that can leave the app between images, which is a worse outcome than
# waiting out a deploy that a newer one will supersede seconds later anyway.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # Decides whether this run should deploy at all, and says so out loud.
  #
  # **The workflow definition and the tree it operates on are two different
  # commits, and nothing used to reconcile them.** For `workflow_run` GitHub
  # takes the workflow file from the default branch's tip, while the checkout
  # below deliberately pins the triggering commit. Both halves are right on
  # their own; together they mean a run can execute master's newest steps
  # against a checkout that predates them.
  #
  # That is observed, not theorised. Run 32585058437, 2026-08-22: PR #139 merged,
  # then PR #137 - which added scripts/verify-fly-release.sh and the step calling
  # it - merged moments later. The deploy triggered by #139's CI ran with
  # github.sha = 5ec3e82 (#137, already carrying the new step) against a checkout
  # of 9369bb5 (#139), which predates the script:
  #
  #   ./scripts/verify-fly-release.sh: No such file or directory
  #   ##[error]Process completed with exit code 127
  #
  # That failure was loud. The same mechanism running the other way is silent: a
  # step *deleted* from the workflow still runs when the trigger is old, and a
  # step that reads a config file which has since changed shape reads it wrongly
  # with nothing to report.
  #
  # **The fix is to deploy only master's tip, rather than to reconcile the two
  # halves after the fact.** `github.sha` on a `workflow_run` event is the last
  # commit on the default branch - which is exactly the commit the workflow
  # definition was taken from - so requiring it to equal the commit being checked
  # out collapses workflow, tree and tip into one commit. Both directions of the
  # problem then cannot arise, rather than being detected.
  #
  # It also fixes a second hazard that had nothing to do with missing scripts.
  # `concurrency` above queues deploys rather than superseding them, and nothing
  # ordered the queue by commit. Two commits landing close together, the newer
  # one's CI finishing first, would deploy the newer and then the older on top -
  # a silent rollback of whatever the newer one changed, lasting until the next
  # push. An older commit's run now skips instead.
  #
  # **What this gives up**, deliberately: if master's tip goes red, the previous
  # green commit no longer ships. Its run skips because it is not the tip, and
  # the tip's own run never happens because CI failed. Nothing is lost, and the
  # next green commit carries everything - but a red master now blocks deploys
  # rather than quietly shipping the commit before it. A red master is already
  # the thing to fix first.
  #
  # A separate job rather than a condition on `deploy` itself so the decision is
  # *visible*. Both values are plain contexts, so this could have been an
  # expression in the job-level `if` below - but a job that reports "skipped"
  # with no reason is the same genre of silence as the bug it fixes.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The conclusion gate stays at job level, where it was, so a red CI costs no
    # runner at all - it is by far the most common reason not to deploy, and a
    # skipped Deploy API after a failed CI needs no explaining. The decision this
    # job exists to narrate is the surprising one below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        env:
          # The commit CI passed on, and the one the deploy would check out.
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          # The default branch's tip, and the commit this very file came from.
          TIP_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          # workflow_dispatch checks out a hard 'master', so it is the tip by
          # construction and there is nothing to compare.
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual dispatch: deploying master."
            exit 0
          fi

          # Belt and braces. The job-level `if` above already screens this out,
          # so reaching here means that condition and this one have drifted
          # apart - which should fail closed rather than deploy. `completed`
          # includes failure and cancelled.
          if [ "$CONCLUSION" != success ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI concluded '$CONCLUSION', not 'success'. Not deploying."
            exit 0
          fi

          if [ "$TRIGGER_SHA" != "$TIP_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping: $TRIGGER_SHA is no longer master's tip ($TIP_SHA)."
            echo "::notice::This workflow file came from $TIP_SHA, so its steps and the"
            echo "::notice::checkout would be different commits - see the comment in"
            echo "::notice::deploy-api.yml. Deploying anyway could also put an older"
            echo "::notice::commit on top of a newer one that already shipped."
            echo "::notice::$TIP_SHA deploys via its own CI run. Nothing to do here."
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "::notice::$TRIGGER_SHA is master's tip and passed CI. Deploying."

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: guard
    if: needs.guard.outputs.deploy == 'true'
    steps:
      # Two things this ref is doing. For workflow_run, checkout would otherwise
      # take the default branch's tip rather than the commit CI actually ran
      # against - pinning head_sha keeps the deployed image and the tested
      # commit the same thing. For workflow_dispatch it is a hard 'master',
      # not github.ref: dispatching from a feature branch would otherwise push
      # that branch straight onto the production machine, and per-branch API
      # deploys are explicitly out of scope for this migration.
      #
      # The `guard` job above has already established that this ref *is* the
      # default branch's tip, so the pin is no longer the only thing keeping the
      # deployed image and the tested commit together - it is now also the same
      # commit this workflow file was read from. Keep the pin regardless: it is
      # what makes that equality checkable rather than assumed, and dropping it
      # would silently reintroduce "deploy whatever master is now" on a run
      # triggered by an older commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'master' }}

      # Pinned to an exact tag rather than the moving `v1`, unlike the actions/*
      # majors elsewhere. This is the only job that holds FLY_API_TOKEN, so a
      # ref that moves on its own would let an upstream change reach the
      # credential with no change on our side.
      #
      # The cost of that choice is this: an exact pin does not pick up runtime
      # bumps either. `v1.4` sat on node16 until GitHub's node20 deprecation
      # surfaced it. Re-check this tag whenever a runner deprecation lands.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      # Before the deploy, because a machine_config.json naming a secret that
      # does not exist produces a config flyd cannot apply - it reverts the
      # machine, and flyctl reports success over the top of it. The Verify step
      # at the end catches that, but only after a full remote build and only by
      # its symptom. This catches the cause, in seconds, and says which name is
      # wrong. It also catches the opposite drift, which Verify cannot see at
      # all: a secret that exists and reaches no container is simply empty at
      # runtime, and has twice meant a security property silently not holding.
      #
      # It lives here rather than in ci.yml because it needs FLY_API_TOKEN, and
      # this job is deliberately the only holder of it. The cost is that the
      # check runs on master rather than on the pull request that introduced the
      # drift - acceptable, since it still runs before anything is deployed.
      - name: Check the declared secrets against the app's
        run: ./scripts/check-fly-secrets.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Go, for the migration step below. Not needed by anything else in this
      # job - flyctl builds the image on Fly's remote builder, not here.
      - uses: actions/setup-go@v7
        with:
          # Matches go.mod's `go 1.25.0`, the Dockerfile's build stage and
          # ci.yml's `go` job.
          go-version: '1.25'
          cache-dependency-path: netlify-functions/recipes/go.sum

      # **The step this workflow was missing.** It had three guards - CI green,
      # the declared secrets matching the app's, the machines actually taking
      # the release - and not one of them asked whether the database had the
      # columns the new code was about to select. So on 2026-08-27 it shipped
      # #133, whose queries select `recipe.featured`, while migration 042 that
      # adds that column sat unapplied; every GET /recipe/{id} answered 500 for
      # a day. No test could have caught it, because every environment a test
      # runs in builds its schema from migrations/*.sql at the same commit as
      # the code - production was the only one that could drift and the only one
      # with no record of what it had.
      #
      # Before the deploy, so the schema is never behind the code. See the
      # header of migrate-prod.sh for the consequence of that ordering: a
      # destructive migration has to be split across two releases, because
      # between this step and the release the *old* code is running against the
      # *new* schema.
      #
      # Fails the job on any error, which stops the deploy. That is the intended
      # relationship: shipping code whose migration would not apply is the thing
      # being prevented, so a broken migration must not become a broken
      # production API as well.
      #
      # TIDB_PASSWORD is a repository secret; TIDB_MIGRATE_USER is a repository
      # *variable*, because a username identifies an account without opening it -
      # the same argument .env.tidb makes for tracking the root username in git,
      # and it means a failed deploy can say which account it tried.
      #
      # Both are passed because both have to change together. The username comes
      # from .env.tidb otherwise, which names root: a new password with the old
      # username authenticates root and fails. scripts/lib/tidb-env.sh only fills
      # in values that are not already set, so the variable wins when present and
      # .env.tidb still applies when it is not.
      #
      # The account this should name is not root. See docs/ci-database-user.md
      # for the grant, which is derived from the statements migrations/ actually
      # contains rather than guessed, and for how to create and rotate it.
      #
      # Until the secret exists this step fails, naming it.
      #
      # MIGRATE_GO=host uses the toolchain setup-go installed just above rather
      # than the container the script defaults to. That default exists because a
      # laptop usually has no Go; a runner that has just installed the pinned
      # version does not need a ~350MB image pulled to supply it again, and
      # putting Docker Hub on the production deploy path would be a new way for
      # a deploy to fail for reasons unrelated to the deploy.
      - name: Apply pending database migrations
        run: ./scripts/migrate-prod.sh
        env:
          TIDB_USER: ${{ vars.TIDB_MIGRATE_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          MIGRATE_GO: host

      # --remote-only builds on Fly's builder rather than this runner. It is
      # already flyctl's default (--local-only is the opt-out), so this is
      # explicit rather than necessary - worth keeping so the intent survives a
      # future change of default, since a runner without a warm Docker cache is
      # the last place we want building this.
      #
      # The config lives next to the Dockerfile, so the build context is the Go
      # module alone rather than the whole repo.
      #
      # FLY_API_TOKEN is a repository secret, created with
      # `fly tokens create deploy` - app-scoped and deploy-only, unlike a
      # personal access token. See docs/fly-migration-runbook.md. Until it
      # exists, every run of this workflow fails at this step.
      # SERVICE_VERSION becomes OTel's service.version on every span, metric and
      # log line the API emits, which is what makes "is this still happening
      # after the fix?" answerable at all. It has to be passed here because the
      # image is built by Fly's remote builder from a context that is the Go
      # module alone - there is no .git in it to derive a sha from.
      #
      # The same ref the checkout above used, so the version a trace reports and
      # the commit CI tested are the same thing. Falls back to github.sha for
      # workflow_dispatch, where there is no triggering workflow_run. Without
      # this the Dockerfile's default applies and every production trace claims
      # to be "unknown" - which fails quietly, since telemetry still flows.
      - name: Deploy
        run: |
          flyctl deploy --remote-only --config fly.toml \
            --build-arg SERVICE_VERSION="${SERVICE_VERSION::7}"
        working-directory: netlify-functions/recipes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SERVICE_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The step above exiting 0 does not mean anything was deployed. flyctl
      # creates a release and hands it to flyd; flyd can fail to apply it and
      # revert the machine to its last working config, after which flyctl sees a
      # started, healthy machine and reports success. That is not hypothetical -
      # it froze production for a day in August 2026 while eleven consecutive
      # runs of this workflow reported success. The script says how, and why no
      # field on the release record can be read instead.
      #
      # A step in *this* job rather than a separate workflow, for three reasons.
      # A run's conclusion is per-run, so only a step here can make Deploy API
      # itself red - a second workflow would leave this one green, which is the
      # exact failure being fixed. The `concurrency` group above serialises
      # deploys, and a separate workflow would sit outside it, free to verify
      # against a release a queued deploy had already superseded. And this job
      # is deliberately the only holder of FLY_API_TOKEN.
      #
      # Distinct from the deploy step, though, because the two failures want
      # different responses: a red Deploy is flyctl failing (build, token,
      # timeout), a red Verify is flyctl succeeding while the machines refuse
      # the config.
      # No working-directory: the script cd's to the module holding fly.toml
      # itself, so it behaves the same run from a workflow, a laptop or a hook.
      - name: Verify the machines took the release
        run: ./scripts/verify-fly-release.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
