          - generic [ref=e150]:
            - term [ref=e151]: Do I have to type all my recipes in?
            - definition [ref=e152]: No. Paste a link and the page is read for you; photograph a cookbook and so is that. Typing is the fallback rather than the default — and even then you can paste the whole ingredient list in one lump instead of a row at a time.
          - generic [ref=e153]:
            - term [ref=e154]: Will it work with the sites I use?
            - definition [ref=e155]: It reads the page itself rather than following rules written for a handful of named sites, so it isn’t limited to a supported list. When a page does defeat it, what it did get still opens in the form and you fill in the rest.
          - generic [ref=e156]:
            - term [ref=e157]: Can I share it with the person I shop with?
            - definition [ref=e158]: Yes — invite them by email and you have one collection and one list between you, ticked boxes and all. That’s the whole point of it, not an extra.
          - generic [ref=e159]:
            - term [ref=e160]: What does it cost?
            - definition [ref=e161]: Nothing. There’s no card to enter, no trial counting down, and no plan to be upgraded to.
