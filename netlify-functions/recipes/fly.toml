# Fly.io config for the Go API.
#
# Why Fly, why `fra`, and why one always-on machine:
# docs/adr/0006-go-api-leaves-netlify-functions.md. How the migration was
# carried out: specs/api-hosting-migration.md.
#
# Deploy from the repository root with:
#   fly deploy ./netlify-functions/recipes
# (this file sits next to the Dockerfile so the build context is the Go module
# and nothing else - not the whole repo). docs/fly-migration-runbook.md has the
# first-time setup, including the DSN secret.

app = "big-shop-api"

# Frankfurt: the same metro as the TiDB cluster in AWS eu-central-1. Not the
# same provider network - Fly runs its own hardware - so the DB hop is
# Frankfurt peering at ~1-5ms rather than intra-AWS at ~0.5-1ms. Knowingly
# accepted in ADR-0006; it is still ~90ms better than us-east-2.
primary_region = "fra"

# Two containers in one Machine - the Go API and an OpenTelemetry Collector
# sidecar (docs/adr/0007-observability-otel-grafana-cloud.md) - defined in
# machine_config.json. `container` names which of them receives the image built
# from the Dockerfile below; the collector runs a published image.
#
# **Why machine_config and not [build.compose].** A compose deploy was tried
# first and failed outright: no `fly secrets` reached either container, so the
# API fell back to an empty DSN and died on
# `dial tcp 127.0.0.1:3306: connect: connection refused` before serving
# anything. The cause is not a platform bug - in a multi-container Machine a
# container receives ONLY the secrets it declares, and the compose path gives no
# way to declare them. Proved by probe; see specs/observability.state.md.
#
# **The trap this introduces, and it is a quiet one.** `fly secrets set` is no
# longer sufficient by itself. A secret not listed in that container's `secrets`
# array is simply absent at runtime, with nothing anywhere reporting a problem -
# which for a credential means a feature that fails only when exercised. Adding
# a secret is now a two-part change: set it, and declare it.
#
# Live example, now resolved and left here as the worked one: SENDGRID_API_KEY
# was read by the API for invitation emails while not being set on this app at
# all, so that flow was broken independently of any of this. It is now set with
# `fly secrets set` AND declared in the `api` container's `secrets` array in
# machine_config.json. Doing only the first would have left it absent at runtime
# with nothing reporting a problem - a feature that fails only when exercised.
#
# **And it caught the very next secret anyway**, which is worth recording here
# rather than treating the trap as closed. #59 added INVITE_EMAIL_PEPPER; #50
# edited machine_config.json days later and declared only SENDGRID_API_KEY. So
# the pepper was absent at runtime and service.HashEmail silently degraded to a
# plain SHA-256 - invites kept working, because the digest is deterministic
# either way, which is exactly why nobody noticed. It is declared as of
# specs/transactional-email.md.
#
# The lesson generalises past both: this failure has no symptom. A missing
# credential that only weakens a security property, rather than breaking a
# request, will not announce itself. Adding a secret means editing two files,
# and the second one is this repository's.
#
# `[experimental]` is Fly's own naming for this block, not a comment on how
# settled the approach is.
[experimental]
  machine_config = "machine_config.json"
  container = "api"

[build]
  dockerfile = "Dockerfile"

# Three of the Go process's environment variables (grep os.Getenv) are public
# identifiers and live here, in version control, so a deploy cannot forget them:
#
#   AUTH0_DOMAIN / AUTH0_AUDIENCE - both are already public in
#     .env.development. Getting these wrong does not fail loudly: with
#     AUTH0_DOMAIN unset the JWKS fetch goes to https:///.well-known/jwks.json
#     and every authenticated route rejects, while /health stays green and the
#     machine looks perfectly healthy.
#
#   AUTH0_TENANT_DOMAIN - the canonical tenant domain, needed only because
#     AUTH0_DOMAIN is now a custom one. A domain name is not a secret, so it
#     belongs here rather than in `fly secrets` - which is where
#     docs/fly-migration-runbook.md used to imply it went. See the note by the
#     value itself.
#
# Two are secrets, set out-of-band with `fly secrets set` (see
# docs/fly-migration-runbook.md) and deliberately absent from this file:
#
#   DSN               - TiDB connection string
#   SENDGRID_API_KEY  - every email Big Shop sends (internal/pkg/service/email).
#                       Now genuinely set, and correspondingly declared in the
#                       `api` container's `secrets` array in machine_config.json.
#                       Both halves are required; see the trap above.
#
# The fifth, DISABLE_AUTH, must never be set here. It is a local-development
# switch that makes the API resolve every request to DEV_USER_ID without
# validating a token; docker-compose.yml is the only place it belongs.
# These reach *every* container in the Machine. `fly secrets` do not: under
# machine_config each container receives only the secrets it names, which was
# measured, not assumed - a probe container declaring only
# GRAFANA_CLOUD_OTLP_ENDPOINT saw that and could not see DSN.
#
# So ADR-0007's "credentials live in collector config, not application code"
# holds more strongly than it reads: the API container need never be given a
# Grafana credential at all, and the collector need never be given DSN.
[env]
  # The custom domain, because it is the issuer of the login tokens this API
  # validates: a token minted at auth.bigshop.life carries
  # `iss: https://auth.bigshop.life/`, and newJWTMiddleware pins the validator to
  # exactly one issuer string. It also fixes the JWKS origin, which is fine -
  # Auth0 serves the same keys on both names.
  #
  # **This value and the browser's NEXT_PUBLIC_AUTH0_DOMAIN must agree.** They
  # are deployed by two different systems - Netlify builds the site, and
  # .github/workflows/deploy-api.yml ships this - so they can disagree for as
  # long as one deploy outlives the other, and while they do, every
  # authenticated request 401s. Change them in the same commit; expect a short
  # window regardless.
  AUTH0_DOMAIN = "auth.bigshop.life"
  AUTH0_AUDIENCE = "https://big-shop-api"

  # The **canonical** tenant domain, for the Management API only, and the one
  # value here whose absence is silent rather than loud.
  #
  # Auth0's rule behind a custom domain is asymmetric: the Management API
  # audience must stay the canonical domain, while the token request and the API
  # call must share a host. service.auth0TenantDomain falls back to AUTH0_DOMAIN
  # when this is unset - correct only while the two were the same string, which
  # stopped being true the line above. Without this, the audience follows the
  # custom domain somewhere Auth0 rejects, and account deletion carries on
  # deleting every database row while silently skipping the Auth0 identity: the
  # deleted user can still log in, resolving to nothing. That is exactly the bug
  # board item #59 existed to fix, reintroduced by a domain change.
  AUTH0_TENANT_DOMAIN = "dev-x-n37k6b.eu.auth0.com"

  # Without this, production telemetry arrives labelled `development` (the
  # default in telemetry.environment()) and is indistinguishable from a laptop's
  # in the same Tempo - which, on a single shared stack, is the whole of the
  # separation.
  DEPLOY_ENV = "production"

  # The SendGrid unsubscribe group (ASM) every onboarding email is sent under.
  #
  # Here rather than in `fly secrets` because it is not a credential - it is a
  # numeric identifier that appears in the headers of mail we send to strangers.
  # Values in this block also reach every container without the declare-it-twice
  # trap above, which is the right trade for something that is not sensitive.
  #
  # It is not optional decoration. internal/pkg/service/email's SendLifecycle
  # refuses to send at all without it: no group means no unsubscribe link and no
  # List-Unsubscribe header, and ADR-0010 rests the lawful basis for sending
  # onboarding email to people who never opted in on both being present. Unset
  # this and the sequence stops rather than sending something the basis does not
  # cover. Transactional mail sets no group and is unaffected.
  SENDGRID_ASM_GROUP_ID = "32124"

  # The switch for the onboarding email programme. **Off.**
  #
  # Everything the sequence needs is already live - a real SendGrid key, a
  # verified sender, the unsubscribe group above - so without this flag the code
  # would begin mailing real people the moment it deployed, on the strength of a
  # merge rather than a decision. Flipping this to "true" is that decision, and
  # it is a one-line change with a deploy behind it.
  #
  # It gates the hourly ticker and the welcome email sent on signup. It
  # deliberately does NOT gate `send-test`, which is how the copy and the
  # unsubscribe link get checked in a real inbox first, nor the Account invite,
  # which is transactional and predates the programme.
  #
  # **Before switching it on, consider the gap.** Users who signed up between
  # the deploy and the flip are already past day 0, 3 or 8, so the ticker will
  # walk each of them through the backlog one email a day - meaning a "Welcome
  # to Big Shop" a fortnight late. That is the same wound the launch cutoff
  # exists to prevent, just smaller. If the gap has grown long enough to matter,
  # move the cutoff forward first:
  #
  #   UPDATE email_launch SET launched_at = NOW() WHERE id = 1;
  #
  # which excludes everyone who signed up before that moment, exactly as it
  # excluded the original user base.
  ONBOARDING_EMAIL_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true

  # Never stop the machine. Cold starts are the thing this migration exists to
  # remove, so paying for an idle machine is the point rather than a waste.
  # (min_machines_running is deliberately absent: it only governs how far
  # autostop is allowed to scale down, so it would be inert alongside this.)
  auto_stop_machines = false
  auto_start_machines = true

  [[http_service.checks]]
    # /health is the one route with no JWT requirement (see app.go's carve-out
    # ahead of the CORS and auth middleware), which is what makes it usable
    # here - a health check cannot hold an Auth0 token. Note it is under the
    # router's base path, not at the root.
    path = "/api/bigshop/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  # 512MB rather than the 256MB a Go API of this size needs, to leave room for
  # the OpenTelemetry collector sidecar - which specs/observability.md has now
  # added, so this is occupied rather than reserved. Measured at ~36MB idle
  # running the committed config locally, and the collector's own memory_limiter
  # is set to cap it at 96MB + a 32MB spike allowance, so it cannot grow into
  # the API's share under load or a stalled export.
  memory = "512mb"
