# Deploys the Go API to Fly.io (app `big-shop-api`, region fra).
#
# Netlify no longer deploys this API - see
# docs/adr/0006-go-api-leaves-netlify-functions.md. The Next.js site is still
# Netlify's, deployed on its own from the same push; the two pipelines are
# independent, which is one of the migration's accepted consequences.
name: Deploy API

# Gated on CI rather than triggered directly by the push, so a master commit
# that fails `go test` or a drift check is never deployed. `workflow_run` fires
# after CI finishes; the `if` below is what makes success (not merely
# completion) the condition - without it this would deploy failed builds, since
# `completed` includes `failure` and `cancelled`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # For redeploying master without pushing anything - e.g. after rotating a Fly
  # secret, which does not itself trigger a release. Always master, whatever
  # branch it is dispatched from: see the checkout step.
  workflow_dispatch:

# One deploy at a time. Queued rather than superseded (cancel-in-progress:
# false) because the thing being cancelled is a `flyctl deploy` mid-release -
# killing that can leave the app between images, which is a worse outcome than
# waiting out a deploy that a newer one will supersede seconds later anyway.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Two things this ref is doing. For workflow_run, checkout would otherwise
      # take the default branch's tip rather than the commit CI actually ran
      # against - pinning head_sha keeps the deployed image and the tested
      # commit the same thing. For workflow_dispatch it is a hard 'master',
      # not github.ref: dispatching from a feature branch would otherwise push
      # that branch straight onto the production machine, and per-branch API
      # deploys are explicitly out of scope for this migration.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'master' }}

      # Pinned to an exact tag rather than the moving `v1`, unlike the actions/*
      # majors elsewhere. This is the only job that holds FLY_API_TOKEN, so a
      # ref that moves on its own would let an upstream change reach the
      # credential with no change on our side.
      #
      # The cost of that choice is this: an exact pin does not pick up runtime
      # bumps either. `v1.4` sat on node16 until GitHub's node20 deprecation
      # surfaced it. Re-check this tag whenever a runner deprecation lands.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      # --remote-only builds on Fly's builder rather than this runner. It is
      # already flyctl's default (--local-only is the opt-out), so this is
      # explicit rather than necessary - worth keeping so the intent survives a
      # future change of default, since a runner without a warm Docker cache is
      # the last place we want building this.
      #
      # The config lives next to the Dockerfile, so the build context is the Go
      # module alone rather than the whole repo.
      #
      # FLY_API_TOKEN is a repository secret, created with
      # `fly tokens create deploy` - app-scoped and deploy-only, unlike a
      # personal access token. See docs/fly-migration-runbook.md. Until it
      # exists, every run of this workflow fails at this step.
      # SERVICE_VERSION becomes OTel's service.version on every span, metric and
      # log line the API emits, which is what makes "is this still happening
      # after the fix?" answerable at all. It has to be passed here because the
      # image is built by Fly's remote builder from a context that is the Go
      # module alone - there is no .git in it to derive a sha from.
      #
      # The same ref the checkout above used, so the version a trace reports and
      # the commit CI tested are the same thing. Falls back to github.sha for
      # workflow_dispatch, where there is no triggering workflow_run. Without
      # this the Dockerfile's default applies and every production trace claims
      # to be "unknown" - which fails quietly, since telemetry still flows.
      - name: Deploy
        run: |
          flyctl deploy --remote-only --config fly.toml \
            --build-arg SERVICE_VERSION="${SERVICE_VERSION::7}"
        working-directory: netlify-functions/recipes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SERVICE_VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The step above exiting 0 does not mean anything was deployed. flyctl
      # creates a release and hands it to flyd; flyd can fail to apply it and
      # revert the machine to its last working config, after which flyctl sees a
      # started, healthy machine and reports success. That is not hypothetical -
      # it froze production for a day in August 2026 while eleven consecutive
      # runs of this workflow reported success. The script says how, and why no
      # field on the release record can be read instead.
      #
      # A step in *this* job rather than a separate workflow, for three reasons.
      # A run's conclusion is per-run, so only a step here can make Deploy API
      # itself red - a second workflow would leave this one green, which is the
      # exact failure being fixed. The `concurrency` group above serialises
      # deploys, and a separate workflow would sit outside it, free to verify
      # against a release a queued deploy had already superseded. And this job
      # is deliberately the only holder of FLY_API_TOKEN.
      #
      # Distinct from the deploy step, though, because the two failures want
      # different responses: a red Deploy is flyctl failing (build, token,
      # timeout), a red Verify is flyctl succeeding while the machines refuse
      # the config.
      # No working-directory: the script cd's to the module holding fly.toml
      # itself, so it behaves the same run from a workflow, a laptop or a hook.
      - name: Verify the machines took the release
        run: ./scripts/verify-fly-release.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
