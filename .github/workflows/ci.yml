name: CI

# `push: branches: [master]` is load-bearing, but not for the reason it looks
# like. It is not extra check coverage: a direct push to master is *rejected*,
# not merely ungated (CLAUDE.md), so every commit reaching master has already
# been through a pull request where this workflow ran.
#
# It is here because deploy-api.yml keys off `workflow_run` with
# `branches: [master]`, and that filter matches the *triggering* run's head
# branch. A pull_request-triggered run's head branch is the PR's own branch,
# never master - so with only the pull_request trigger, no CI run would ever
# carry head_branch=master, workflow_run would never fire, and the API would
# simply never deploy.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # A script that loses its executable bit is invisible in review: the
      # content diff is empty, so a mode change shows up as nothing at all in
      # the files-changed view. The first symptom is a deploy dying on
      # "Permission denied" with exit code 126, in a job that only runs after
      # the merge.
      #
      # That is not hypothetical - it is how this check came to exist. #164
      # rewrote scripts/migrate-prod.sh through a temp file and `mv`, which
      # creates the replacement with the default 0644 rather than preserving
      # 0755, and the next deploy could not run the migrations step at all.
      #
      # Ahead of setup-node deliberately: it is a git question needing no
      # toolchain, so it reports in seconds.
      # scripts/lib/ is deliberately excluded: those files are *sourced*
      # (`. scripts/lib/tidb-env.sh`), never executed, so 0644 is correct for
      # them and requiring 0755 would be wrong. The `:(glob)` prefix is what
      # makes that exclusion hold - without it git's pathspec `*` matches
      # across `/` too, and the check flags scripts/lib as well.
      - name: Scripts are executable
        run: |
          non_exec="$(git ls-files -s ':(glob)scripts/*.sh' | awk '$1 != "100755" { print $4 }')"
          if [ -n "$non_exec" ]; then
            echo "These scripts are not executable in git (expected mode 100755):"
            echo "$non_exec"
            echo
            echo "Fix with: git update-index --chmod=+x <file>"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # @netlify/plugin-nextjs is a devDependency only so netlify.toml's plugin
      # entry resolves during Netlify's own deploy build. Plain `npm ci` is
      # fine: the --ignore-scripts workaround this step used to carry was for
      # the v4 runtime's bundled @netlify/esbuild, which v5 does not depend on.
      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # The Go API's checks, moved here from build.sh - which is to say, off
  # Netlify's deploy build, where they were the only thing running them. The
  # API leaves Netlify Functions for Fly (docs/adr/0006-...), so build.sh stops
  # having a Go toolchain to run them with.
  #
  # Deliberately a separate job from build-lint-test rather than more steps on
  # it: it needs Go and not Node, and the two have no ordering between them.
  #
  # Required. The `required checks` ruleset lists build-lint-test, e2e and
  # `go`, so a red job here blocks the merge.
  #
  # It did not always, and the gap was worse than a missing gate: deploy-api.yml
  # keys off this whole workflow's conclusion, so a red `go` merged through the
  # un-updated ruleset silently stopped the API deploying while Netlify went on
  # shipping the site from that same commit - a frontend and an API drifting
  # apart with no red required check anywhere to say so.
  #
  # The ruleset matches on **job name**, so renaming this job silently removes
  # the gate rather than breaking it. Rename it and update the ruleset in the
  # same change.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      # fetch-depth: 0 for the migration check below, which needs the merge base
      # with master. The default shallow fetch has neither master nor enough
      # history to find one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ahead of setup-go, because it is a git question and needs no toolchain -
      # so a renumbering mistake reports in seconds rather than after a Go
      # install and a test run.
      #
      # internal/pkg/migrate refuses an already-applied migration whose contents
      # have changed, and a pending one that sorts below the high-water mark.
      # Neither is findable in any test environment, however thorough: CI builds
      # every database by replaying migrations/ from empty in filename order,
      # which is precisely the state in which neither problem exists. A 043
      # added after 044 has shipped replays perfectly from scratch, and so does
      # a migration edited long after it was applied. They are visible only
      # against a database alive across both commits - production.
      #
      # Without this the first report is deploy-api.yml going red on master,
      # after the merge. That workflow only deploys master's tip, so a stuck
      # migration then blocks every later merge from deploying too, not just the
      # one that caused it.
      #
      # In this job rather than build-lint-test because migrations are the API's
      # schema, and this job is where the API's other schema-shaped checks live
      # (the openapi.yaml and api.d.ts drift checks below). It was briefly in
      # build-lint-test for one reason only - `go` did not gate merges then, and
      # a check that reports without gating is not a check.
      #
      # working-directory overrides this job's default of api, which every
      # other step here wants and this one does not: migrations/ and scripts/
      # are at the repo root. Without it the path does not resolve and the step
      # fails for a reason that has nothing to do with migrations.
      - name: Migrations are append-only
        working-directory: .
        run: ./scripts/check-migrations-append-only.sh "origin/${{ github.event.pull_request.base.ref || 'master' }}"

      - uses: actions/setup-go@v7
        with:
          # Matches go.mod's `go 1.25.0` and the Dockerfile's build stage.
          go-version: '1.25'
          cache-dependency-path: api/go.sum

      # `gofmt -l`, not `go fmt ./...`: the latter *rewrites* the files and
      # exits 0 regardless, so as a CI gate it passes unconditionally. It has
      # been a no-op in build.sh all along. This one lists the files that need
      # formatting and fails if the list is non-empty.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race because internal/pkg/purge is the first concurrent production
      # code in this repo: a mutex, a background goroutine per purge and a
      # time.AfterFunc callback that shares state with the caller. Its
      # correctness rests on an ordering argument (see Purge's comment on the
      # `pending` flag), and the way that argument gets broken is a data race,
      # which a plain `go test` will not report.
      - name: Test
        run: go test ./... -v -race

      # docs/openapi.yaml is generated from app.go's route registrations, and
      # types/api.d.ts from it in turn. Both are committed, so both can drift -
      # notably if main.go's basePath changes, which is exactly what this
      # migration did.
      - name: Check docs/openapi.yaml is up to date
        run: |
          if ! diff -u ../docs/openapi.yaml <(go run . openapi); then
            echo "docs/openapi.yaml is out of date. Regenerate it with:"
            echo "  cd api && go run . openapi > ../docs/openapi.yaml"
            exit 1
          fi

      # Needs Node, but belongs to this job: it checks the artefact generated
      # from the one immediately above, and running it here keeps the whole
      # generated-file chain failing in one place.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # openapi-typescript is a pinned devDependency. Installing it rather than
      # letting `npx` fetch whatever is newest matters: a different generator
      # version emits different output, which would fail this check as drift
      # when the committed file is in fact exactly what `npm run
      # generate:api-types` produces locally.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Check types/api.d.ts is up to date
        working-directory: ${{ github.workspace }}
        run: |
          if ! diff -u types/api.d.ts <(npx openapi-typescript docs/openapi.yaml); then
            echo "types/api.d.ts is out of date. Regenerate it with:"
            echo "  npm run generate:api-types"
            exit 1
          fi
