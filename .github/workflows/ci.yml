name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @netlify/plugin-nextjs is a devDependency only so netlify.toml's plugin
      # entry resolves during Netlify's own deploy build. Plain `npm ci` is
      # fine: the --ignore-scripts workaround this step used to carry was for
      # the v4 runtime's bundled @netlify/esbuild, which v5 does not depend on.
      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
